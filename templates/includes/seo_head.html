{% load static %}
<!-- Primary Meta Tags -->
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Vibhu Travel Hub">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#000000">

<!-- Canonical URL (Dynamic HTTPS Production Domain) -->
<link rel="canonical" href="https://vibhutravelhub.com{{ request.path }}">

<!-- Title -->
<title>{% block title %}{{ seo_title|default:"Luxury Travel Services in South India | Vibhu Travel Hub" }}{% endblock %}</title>

<!-- Meta Description -->
<meta name="description" content="{% block description %}{{ seo_description|default:"Vibhu Travel Hub is a premier travel agency offering cab service, outstation cabs, airport transfers, tempo traveller rentals, luxury bus rentals, and tour packages across South India." }}{% endblock %}">

<!-- Meta Keywords -->
<meta name="keywords" content="{% block keywords %}{{ seo_keywords|default:"travel agency, travel agency in tamil nadu, cab service, cab booking, outstation cabs, tempo traveller rental, luxury bus booking, South India tour packages, Vibhu Travel Hub" }}{% endblock %}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vibhu Travel Hub">
<meta property="og:title" content="{% block og_title %}{{ seo_title|default:"Luxury Travel Services in South India | Vibhu Travel Hub" }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ seo_description|default:"Vibhu Travel Hub is a premier travel agency offering cab service, outstation cabs, airport transfers, tempo traveller rentals, luxury bus rentals, and tour packages across South India." }}{% endblock %}">
<meta property="og:url" content="{% block og_url %}https://vibhutravelhub.com{{ request.path }}{% endblock %}">
<meta property="og:image" content="{% block og_image %}https://vibhutravelhub.com{% static 'images/logo/og-banner.webp' %}{% endblock %}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% block twitter_title %}{{ seo_title|default:"Luxury Travel Services in South India | Vibhu Travel Hub" }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ seo_description|default:"Vibhu Travel Hub is a premier travel agency offering cab service, outstation cabs, airport transfers, tempo traveller rentals, luxury bus rentals, and tour packages across South India." }}{% endblock %}">
<meta name="twitter:image" content="{% block twitter_image %}https://vibhutravelhub.com{% static 'images/logo/og-banner.webp' %}{% endblock %}">

<!-- Google Site Verification -->
<meta name="google-site-verification" content="_zCwFqOnZnGMhGv0HUWoKT_BxYdRsI4kqT5lrE6nXh8" />

<!-- Structured Data (JSON-LD) -->

  "email": "vibhutravelhub66@gmail.com",

{% endblock %}
