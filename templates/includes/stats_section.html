                    <div class="premium-stat-card anim-card">

                <div class="col-6 col-lg-3 stagger-3 reveal" data-aos="fade-up" data-aos-delay="300">

                    </div>
                </div>
                <div class="col-6 col-lg-3 stagger-4 reveal" data-aos="fade-up" data-aos-delay="400">
