{% load static %}

<!-- Link to Premium Modal Styles -->
<link rel="stylesheet" href="{% static 'css/premium-enquiry-modal.css' %}?v={{ STATIC_VERSION }}">

<!-- Premium Enquiry Modal V2 -->
<div class="modal fade" id="premiumEnquiryModal" tabindex="-1" aria-labelledby="premiumEnquiryModalLabel" aria-hidden="true" data-bs-backdrop="blur">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            
            <div class="modal-header">
                <h5 class="modal-title" id="premiumEnquiryModalLabel">Book Your <span>Premium Ride</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body">
                <div id="premiumAlertBox"></div>
                
                <form id="premiumEnquiryForm" method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <!-- Full Name -->
                        <div class="col-md-6">
                            <label for="premiumFullName" class="form-label">Full Name *</label>
                            <input type="text" class="form-control anim-input" id="premiumFullName" name="full_name" placeholder="Enter your full name" required>
                        </div>
                        
                        <!-- Mobile Number -->
                        <div class="col-md-6">
                            <label for="premiumMobile" class="form-label">Mobile Number *</label>
                            <input type="tel" class="form-control anim-input" id="premiumMobile" name="mobile" placeholder="Enter your mobile number" required>
                        </div>
                        
                        <!-- Email Address -->
                        <div class="col-md-6">
                            <label for="premiumEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control anim-input" id="premiumEmail" name="email" placeholder="Enter your email address">
                        </div>
                        
                        <!-- Travel Date -->
                        <div class="col-md-6">
                            <label for="premiumTravelDate" class="form-label">Travel Date *</label>
                            <input type="date" class="form-control anim-input" id="premiumTravelDate" name="travel_date" required>
                        </div>
                        
                        <!-- Pickup Location -->
                        <div class="col-md-6">
                            <label for="premiumPickup" class="form-label">Pickup Location *</label>
                            <input type="text" class="form-control anim-input" id="premiumPickup" name="pickup_location" placeholder="City or Landmark" required>
                        </div>
                        
                        <!-- Destination -->
                        <div class="col-md-6">
                            <label for="premiumDestination" class="form-label">Destination *</label>
                            <input type="text" class="form-control anim-input" id="premiumDestination" name="destination" placeholder="City or Landmark" required>
                        </div>
                        
                        <!-- Vehicle Type -->
                        <div class="col-md-6">
                            <label for="premiumVehicle" class="form-label">Vehicle Type *</label>
                            <select class="form-select anim-input" id="premiumVehicle" name="vehicle_type" required>
                                <option value="" disabled selected>Select Vehicle</option>
                                <option value="Sedan (4 Seater)">Sedan (4 Seater)</option>
                                <option value="Ertiga (7 Seater)">Ertiga (7 Seater)</option>
                                <option value="Innova Crysta (7 Seater)">Innova Crysta (7 Seater)</option>
                                <option value="Tempo Traveller AC (12 Seater)">Tempo Traveller AC (12 Seater)</option>
                                <option value="Tempo Traveller Non AC (12 Seater)">Tempo Traveller Non AC (12 Seater)</option>
                                <option value="Traveller Coach (20 Seater)">Traveller Coach (20 Seater)</option>
                                <option value="Traveller Coach (26 Seater)">Traveller Coach (26 Seater)</option>
                                <option value="Mini Bus (30 Seater)">Mini Bus (30 Seater)</option>
                                <option value="Coach Bus (30 Seater)">Coach Bus (30 Seater)</option>
                                <option value="Luxury Bus (40 Seater)">Luxury Bus (40 Seater)</option>
                                <option value="Luxury Bus (45 Seater)">Luxury Bus (45 Seater)</option>
                                <option value="Luxury Bus (54 Seater)">Luxury Bus (54 Seater)</option>
                            </select>
                        </div>
                        
                        <!-- Number of Passengers -->
                        <div class="col-md-6">
                            <label for="premiumPassengers" class="form-label">Number of Passengers *</label>
                            <input type="number" class="form-control anim-input" id="premiumPassengers" name="passengers" min="1" placeholder="e.g. 4" required>
                        </div>
                        
                        <!-- Trip Type -->
                        <div class="col-md-12">
                            <label for="premiumTripType" class="form-label">Trip Type</label>
                            <select class="form-select anim-input" id="premiumTripType" name="trip_type">
                                <option value="" disabled selected>Select Trip Type</option>
                                <option value="One Way">One Way</option>
                                <option value="Round Trip">Round Trip</option>
                                <option value="Local">Local</option>
                                <option value="Outstation">Outstation</option>
                                <option value="Corporate">Corporate</option>
                                <option value="Pilgrimage">Pilgrimage</option>
                                <option value="Tour Package">Tour Package</option>
                            </select>
                        </div>
                        
                        <!-- Message -->
                        <div class="col-md-12">
                            <label for="premiumMessage" class="form-label">Message / Additional Requirements</label>
                            <textarea class="form-control anim-input" id="premiumMessage" name="message" rows="3" placeholder="Tell us more about your trip..."></textarea>
                        </div>
                    </div>
                    
                    <div class="modal-footer mt-4 pb-0 pe-0 ps-0 border-0">
                        <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn-submit anim-btn" id="premiumBtnSubmit">
                            <span class="btn-text">Submit Enquiry</span>
                            <div class="spinner-border spinner-border-sm btn-spinner d-none" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>

<!-- Link to Premium Modal JS -->
<script src="{% static 'js/enquiry-modal-v2.js' %}?v={{ STATIC_VERSION }}"></script>
