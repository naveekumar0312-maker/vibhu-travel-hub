{% extends 'dashboard/base_dashboard.html' %}

{% block title %}Tags{% endblock %}
{% block page_title %}Tags{% endblock %}

{% block content %}
<div class="card glass-card border-0 shadow-sm">
    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center p-4">
        <h5 class="mb-0 fw-bold">Tags</h5>
        <a href="{% url 'dashboard_tag_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Add Tag
        </a>
    </div>
    <div class="card-body px-4 pb-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Slug</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tag in tags %}
                    <tr>
                        <td class="fw-bold">{{ tag.name }}</td>
                        <td>{{ tag.slug }}</td>
                        <td class="text-end">
                            <a href="{% url 'dashboard_tag_edit' tag.id %}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a href="{% url 'dashboard_tag_delete' tag.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this tag?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-4 text-muted">No tags found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
