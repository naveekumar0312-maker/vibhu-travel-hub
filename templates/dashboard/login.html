<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premium Admin</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Global Typography -->
    <link rel="stylesheet" href="/static/css/typography.css?v=global-1">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/dashboard/css/dashboard.css">
</head>
<body class="login-bg">

<div class="login-container">
    <div class="glass-panel login-card text-center">
        <!-- Brand -->
        <div class="mb-4">
            <i class="bi bi-shield-lock-fill text-danger" style="font-size: 3rem;"></i>
            <h3 class="fw-bold mt-2" style="color: var(--text-main); letter-spacing: 1px;">Vibhu<span class="text-danger">Travel</span></h3>
            <p style="color: var(--text-muted); font-size: 14px;">Premium Admin Authentication</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" style="border-radius: 10px; font-size: 14px;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'dashboard_login' %}">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label text-muted small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control anim-input custom-input border-start-0" placeholder="Enter admin username" required autofocus>
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label text-muted small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="password" class="form-control anim-input custom-input border-start-0" placeholder="Enter secure password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label text-muted small" for="remember">Remember me</label>
                </div>
                <a href="#" class="text-danger small text-decoration-none">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn premium-btn w-100 fw-bold py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Secure Login
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
